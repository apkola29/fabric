<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">How credentials flow in HiCRM</title>
<desc id="d">1: the person signs in with a HiCRM password or local demo View as and gets a session cookie. 2: the server signs in to Entra ID as fabrikamsa with an assertion signed by its certificate; federation is also supported. 3: Entra ID returns an access token, kept on the server. 4: the server calls Generate Token V2 for one report and its model, with the person's email and RLS roles. 5: Power BI returns an embed token, requested for 30 minutes by default and capped by the Entra token's expiry. 6: the browser receives the embed URL, embed token and report metadata, never an app credential or Entra token. 7: the browser loads the report with that token. 8: Direct Lake reads OneLake through the fixed workspace-identity connection with SSO off; the model's roles filter the rows.</desc>
<defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7D8590"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5AA6"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B8A8A"/></marker><marker id="a-fab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C55A11"/></marker><marker id="a-con" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#F7F9FC"/><line x1="0" y1="0" x2="0" y2="9" stroke="#E6ECF4" stroke-width="3"/></pattern></defs>
<rect width="1280" height="840" fill="#FFFFFF"/>
<text x="24" y="40" font-size="21" font-weight="700" fill="#1F2328" text-anchor="start"><tspan x="24" dy="0">How credentials flow: from a person's sign-in to a report that shows only their rows</tspan></text>
<text x="24" y="64" font-size="13.5" font-weight="400" fill="#57606A" text-anchor="start"><tspan x="24" dy="0">Fabrikam's Texas rep opens Sales overview. Contoso's people go through the same steps, as contososa, in Contoso's workspace.</tspan></text>
