# Validates the fabric-automation documents on every change to them.
# Runs the validator's own mutation tests first, then the validator in strict mode.
name: fabric-automation validate

on:
  push:
    branches:
      - master
    paths:
      - fabric-automation/**
      - .github/workflows/fabric-automation-validate.yml
  pull_request:
    paths:
      - fabric-automation/**
      - .github/workflows/fabric-automation-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the validator
        working-directory: fabric-automation
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Validate the documents
        working-directory: fabric-automation
        run: python3 scripts/validate_docs.py --strict
