# Validates the fabric-automation documents on every change to them.
# Runs the tests first (the validator's mutation tests, the fact checker's and the toolchain's), then the validator in strict mode, then the toolchain check.
name: fabric-automation validate

on:
  push:
    branches:
      - master
    paths:
      - fabric-automation/**
      - .github/workflows/fabric-automation-validate.yml
      - .github/workflows/fabric-automation-facts.yml
  pull_request:
    paths:
      - fabric-automation/**
      - .github/workflows/fabric-automation-validate.yml
      - .github/workflows/fabric-automation-facts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the workflow copies match their sources
        run: |
          for name in fabric-automation-validate.yml fabric-automation-facts.yml; do
            diff -u "fabric-automation/ci/$name" ".github/workflows/$name"
          done

      - name: Test the validator
        working-directory: fabric-automation
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Validate the documents
        working-directory: fabric-automation
        run: python3 scripts/validate_docs.py --strict

      - name: Verify the toolchain (manifest, profiles, lock and generated host files)
        working-directory: fabric-automation
        run: python3 scripts/toolchain.py verify
