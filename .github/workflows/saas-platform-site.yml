# Publishes only saas-platform/site to GitHub Pages.
# The published payload is static HTML and SVG.
name: saas-platform site

on:
  push:
    branches:
      - master
    paths:
      - saas-platform/site/**
      - .github/workflows/saas-platform-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}saas-platform/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/saas-platform
          # The page and its images only; diagrams.mjs, which draws the images, isn't published.
          cp saas-platform/site/*.html saas-platform/site/*.svg _site/saas-platform/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=saas-platform/">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="description" content="Redirect to the HiCRM on Microsoft Fabric sample site.">
            <title>HiCRM on Microsoft Fabric</title>
          </head>
          <body>
            <main>
              <h1>HiCRM on Microsoft Fabric</h1>
              <p><a href="saas-platform/">Open the HiCRM sample site.</a></p>
            </main>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1